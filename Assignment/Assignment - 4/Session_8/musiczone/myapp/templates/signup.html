<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
        }

        .auth-card {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .2);
            padding: 35px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-auth {
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: bold;
        }

        .btn-auth:hover {
            color: #fff;
            opacity: .9;
        }
    </style>

</head>

<body>

    <div class="auth-card">

        <h2 class="text-center fw-bold mb-4">Create Account</h2>

        <span class="text-success">{{msg}}</span>

        <form action="" method="post">

            {%csrf_token%}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" name="firstname" placeholder="First Name" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" name="lastname" placeholder="Last Name" required>
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" placeholder="Enter Email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" placeholder="Choose Username" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" placeholder="Create Password" required>
            </div>

            <button type="submit" class="btn btn-auth w-100">
                Register
            </button>

            <div class="text-center">
                <p class="mb-2 text-muted">
                    Already have an account?
                </p>

                <a href="{%url 'index'%}" class="btn btn-outline-primary w-100 rounded-3 fw-semibold">
                    Login
                </a>
            </div>

        </form>

    </div>

</body>

</html>
