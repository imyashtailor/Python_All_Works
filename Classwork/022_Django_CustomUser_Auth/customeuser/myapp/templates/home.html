<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }

        .hero {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 60px 20px;
            border-radius: 0 0 30px 30px;
        }

        .card {
            border: none;
            border-radius: 20px;
            transition: .3s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, .08);
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .btn-custom {
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <div class="hero text-center">

        <h1>College Management System</h1>

        <h4 class="mt-3">
            Welcome,
            <b>{{ user.first_name }}</b>
        </h4>

    </div>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-4">

                <div class="card text-center p-4">

                    <i class="bi bi-mortarboard-fill display-1 text-primary"></i>

                    <h3 class="mt-3">Student Portal</h3>

                    <p>Access courses, assignments, attendance and profile.</p>

                    <a href="{% url 'student' %}" class="btn btn-primary btn-custom">
                        Go to Student
                    </a>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card text-center p-4">

                    <i class="bi bi-person-workspace display-1 text-success"></i>

                    <h3 class="mt-3">Faculty Portal</h3>

                    <p>Manage classes, students, attendance and reports.</p>

                    <a href="{% url 'faculty' %}" class="btn btn-success btn-custom">
                        Go to Faculty
                    </a>

                </div>

            </div>

        </div>

        <div class="text-center mt-5">

            <a href="{% url 'logout' %}" class="btn btn-danger btn-lg">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

    </div>

</body>

</html>
