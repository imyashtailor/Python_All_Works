<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, .15);
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, .2);
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-register {
            border-radius: 12px;
            padding: 12px;
            font-weight: bold;
            background: #fff;
            color: #2575fc;
        }

        .btn-register:hover {
            background: #2575fc;
            color: #fff;
        }

        h2 {
            font-weight: bold;
        }

        label {
            font-weight: 600;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card p-4">

                    <h2 class="text-center mb-4 text-white">
                        <i class="bi bi-person-plus-fill"></i>
                        Create Account
                    </h2>

                    <span class="text-success">{{msg}}</span>

                    <form method="post">

                        {%csrf_token%}

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="text-white">Role</label>
                                <select class="form-select" name="role">
                                    <option selected>Select Role</option>
                                    {%for role in roles%}
                                    <option value="{{role.id}}">{{role.name}}</option>
                                    {%endfor%}
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="text-white">First Name</label>
                                <input type="text" class="form-control" placeholder="Enter First Name" name="firstname">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="text-white">Last Name</label>
                                <input type="text" class="form-control" placeholder="Enter Last Name" name="lastname">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="text-white">Age</label>
                                <input type="number" class="form-control" placeholder="Age" name="age">
                            </div>

                            <div class="col-12 mb-3">
                                <label class="text-white">Address</label>
                                <textarea class="form-control" rows="3" name="adr"></textarea>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="text-white">Phone</label>
                                <input type="tel" class="form-control" placeholder="Phone Number" name="phone">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="text-white">Password</label>
                                <input type="password" class="form-control" placeholder="Password" name="password">
                            </div>

                            <div class="col-12 mt-3">
                                <button class="btn btn-register w-100">
                                    Register
                                </button>
                            </div>

                            <div class="text-center mt-3">
                                <a href="{%url 'index'%}" class="text-white text-decoration-none">
                                    Already have an account? Login
                                </a>
                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
