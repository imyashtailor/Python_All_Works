<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <style>
        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            min-height: 100vh;
            padding: 40px 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .20);
        }

        .card-header {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: #fff;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            padding: 18px;
        }

        .card-body {
            padding: 25px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 15px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 .15rem rgba(13, 110, 253, .25);
        }

        .btn {
            border-radius: 10px;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: #0d6efd;
            color: #fff;
            border: none;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: #f8f9ff;
        }

        /* Keeps Edit & Delete buttons in one line */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .action-buttons .btn {
            white-space: nowrap;
        }
    </style>

    <!-- jquery code started -->
    <script>
        $(document).ready(function () {
            // alert("ok")
            display()
            $("#upbtn").hide()
        })

        const register = () => {
            const name = $('#name').val()
            const email = $('#email').val()
            const age = $('#age').val()

            let csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();

            $.post('register', { csrfmiddlewaretoken, name, email, age }, function (rt) {
                $('#msg').text(rt)
                $('#name').val("")
                $('#email').val("")
                $('#age').val("")
                display()
            })
        }

        const deletestudent = (id) => {
            r = confirm("Are you sure, want to delete?")
            if (r === true) {
                $.get('delete', { id }, function (rt) {
                    $('#msg').text(rt)
                    display()
                })
            }
        }

        const retrive = (id) =>{
            $.get('retrive',{id},function(rt){

                $('#id').val(rt.student[0].id)
                $('#name').val(rt.student[0].name)
                $('#email').val(rt.student[0].email)
                $('#age').val(rt.student[0].age)

                $("#smbtn").hide()
                $("#upbtn").show()
            })
        }

        const update = () => {
            const id = $("#id").val()
            const name = $("#name").val()
            const email = $("#email").val()
            const age = $("#age").val()

            let csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();

            $.post('update', { csrfmiddlewaretoken, id, name, email, age }, function (rt) {
                $('#msg').text(rt)
                $('#name').val("")
                $('#email').val("")
                $('#age').val("")
                display()
                $("#smbtn").show()
                $("#upbtn").hide()
            })
        }


        const display = () => {
            $.get('display', {}, function (rt) {
                var rows = ""
                rt.data.map(ele => {

                    rows += 
                    `<tr>
                        <td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.email}</td>
                        <td>${ele.age}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-warning btn-sm" onclick='retrive(${ele.id})'>
                                    <i class="bi bi-pencil-square"></i> Edit
                                </button>

                                <button class="btn btn-danger btn-sm" onclick='deletestudent(${ele.id})'>
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </td>
                    </tr>`
                })
                $('#tdata').html(rows)
            })
        }

        const search = (q) => {
            $.get('search', {q}, function (rt) {
                var rows = ""
                rt.data.map(ele => {

                    rows += 
                    `<tr>
                        <td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.email}</td>
                        <td>${ele.age}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-warning btn-sm">
                                    <i class="bi bi-pencil-square"></i> Edit
                                </button>

                                <button class="btn btn-danger btn-sm">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </td>
                    </tr>`
                })
                $('#tdata').html(rows)
            })
        }
    </script>


</head>

<body>

    <div class="container">

        <!-- Registration Form -->
        <div class="card mb-4">

            <div class="card-header">
                🎓 Student Registration Form
            </div>

            <div class="card-body">

                <span id="msg" class="text-success"></span>

                {%csrf_token%}

                <input type="hidden" id="id">

                <div class="row g-3 align-items-end">

                    <div class="col-lg-4 col-md-6">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control" name="name" placeholder="Enter Name" id="name">
                    </div>

                    <div class="col-lg-3 col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" placeholder="Enter Email" id="email">
                    </div>

                    <div class="col-lg-2 col-md-4">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" name="age" placeholder="Age" id="age">
                    </div>

                    <div class="col-lg-3 col-md-8">
                        <button class="btn btn-primary w-100" id="smbtn" onclick="register()">
                            <i class="bi bi-person-plus-fill"></i>
                            Register Student
                        </button>

                        <button class="btn btn-primary w-100" id="upbtn" onclick="update()">
                            <i class="bi bi-person-plus-fill"></i>
                            Update Student
                        </button>
                    </div>

                </div>

            </div>

        </div>

        <!-- Student Table -->
        <div class="card"> 

            <div class="card-header">
                📋 Registered Students
            </div>

            <div class="card-body">

                <input type="text" class="form-control" placeholder="Search..." onkeyup="search(value)">
                <br>

                <div class="table-responsive">

                    <table class="table table-hover table-bordered align-middle text-center">

                        <thead>
                            <tr>
                                <th width="60">ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th width="80">Age</th>
                                <th width="200">Action</th>
                            </tr>
                        </thead>

                        <tbody id="tdata">





                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
