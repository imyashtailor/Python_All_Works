<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background: linear-gradient(135deg,#6a11cb,#2575fc);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:Arial, Helvetica, sans-serif;
        }

        .form-card{
            background:#fff;
            border-radius:20px;
            padding:35px;
            box-shadow:0 15px 35px rgba(0,0,0,.2);
            max-width:700px;
            width:100%;
        }

        .form-title{
            font-weight:bold;
            color:#2575fc;
        }

        .form-control,
        .form-select{
            border-radius:10px;
        }

        .btn-custom{
            background:#2575fc;
            color:#fff;
            border:none;
            border-radius:10px;
            transition:.3s;
        }

        .btn-custom:hover{
            background:#0d6efd;
            transform:translateY(-2px);
        }

        .icon{
            color:#2575fc;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-card mx-auto">

        <h2 class="text-center mb-4 form-title">
            <i class="bi bi-person-circle"></i> Registration Form
        </h2>

        <span class="text-success">{{message}}</span>

        <form method="post" action="">

            {%csrf_token%}

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person icon"></i></span>
                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        placeholder="Enter your name"
                        required value="{{student.name}}">
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope icon"></i></span>
                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        placeholder="Enter your email"
                        required value="{{student.email}}">
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock icon"></i></span>
                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        placeholder="Enter password"
                        required value="{{student.password}}">
                </div>
            </div>

            <!-- Gender -->
            <div class="mb-3">
                <label class="form-label d-block">Gender</label>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="Male" {%if student.gender == 'Male'%}checked{%endif%}>
                    <label class="form-check-label">Male</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="Female" {%if student.gender == 'Female'%}checked{%endif%}>
                    <label class="form-check-label">Female</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="Other" {%if student.gender == 'Other'%}checked{%endif%}>
                    <label class="form-check-label">Other</label>
                </div>
            </div>

            <!-- Languages -->
            <div class="mb-3">
                <label class="form-label d-block">Languages</label>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="lang" value="English" {%if 'English' in student.lang%}checked{%endif%}>
                    <label class="form-check-label">English</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="lang" value="Hindi" {%if 'Hindi' in student.lang%}checked{%endif%}>
                    <label class="form-check-label">Hindi</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="lang" value="Gujarati" {%if 'Gujarati' in student.lang%}checked{%endif%}>
                    <label class="form-check-label">Gujarati</label>
                </div>
            </div>

            <!-- Country -->
            <div class="mb-3">
                <label class="form-label">Country</label>
                <select class="form-select" name="country">
                    <option value="">Select Country</option>
                    <option  {%if student.country == 'India'%}selected{%endif%}>India</option>
                    <option {%if student.country == 'USA'%}selected{%endif%}>USA</option>
                    <option  {%if student.country == 'Canada'%}selected{%endif%}>Canada</option>
                    <option  {%if student.country == 'Australia'%}selected{%endif%}>Australia</option>
                    <option {%if student.country == 'UK'%}selected{%endif%}>United Kingdom</option>
                </select>
            </div>

            <!-- Address -->
            <div class="mb-4">
                <label class="form-label">Address</label>
                <textarea
                    class="form-control"
                    name="address"
                    rows="4"
                    placeholder="Enter your address">{{student.address}}</textarea>
            </div>

            <!-- Buttons -->
            <div class="d-grid gap-2">
                {%if student%}
                <button type="submit" class="btn btn-custom btn-lg">
                    <i class="bi bi-check-circle"></i> Update
                </button>
                {%else%}
                <button type="submit" class="btn btn-custom btn-lg">
                    <i class="bi bi-check-circle"></i> Register
                </button>
                {%endif%}

                <button type="reset" class="btn btn-outline-secondary">
                    Reset
                </button>

                <a href="{%url 'display'%}" class="btn btn-outline-warning">
                    Display
                </a>
            </div>

        </form>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
