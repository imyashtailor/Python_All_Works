<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern User Table</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f4f7fb;
            padding: 40px;
        }

        .table-container {
            max-width: 1400px;
            margin: auto;
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid #ececec;
        }

        .table-header h2 {
            font-size: 24px;
            color: #222;
        }

        .add-btn {
            border: none;
            background: #4f46e5;
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: .3s;
        }

        .add-btn:hover {
            background: #3730a3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8fafc;
        }

        th {
            text-align: left;
            padding: 18px;
            color: #64748b;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        td {
            padding: 18px;
            border-top: 1px solid #f1f5f9;
            color: #334155;
            font-size: 15px;
        }

        tbody tr {
            transition: .25s;
        }

        tbody tr:hover {
            background: #f8fbff;
        }

        tbody tr:nth-child(even) {
            background: #fcfcfc;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }

        .male {
            background: #dbeafe;
            color: #2563eb;
        }

        .female {
            background: #fce7f3;
            color: #db2777;
        }

        .language {
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin: 2px;
        }

        .action {
            display: flex;
            gap: 10px;
        }

        .btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            transition: .3s;
        }

        .edit {
            background: #3b82f6;
        }

        .delete {
            background: #ef4444;
        }

        .view {
            background: #10b981;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: .9;
        }

        @media(max-width:1200px) {
            .table-container {
                overflow: auto;
            }

            table {
                min-width: 1200px;
            }
        }
    </style>
</head>

<body>

    <div class="table-container">

        <div class="table-header">
            <h2>User Management</h2>
            <a href="{%url 'index'%}" class="add-btn">
                 Add User
            </a>
        </div>

        <table>

            <thead>
                <tr>
                    <th>SR.NO</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Gender</th>
                    <th>Languages</th>
                    <th>Country</th>
                    <th>Address</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {%for i in students%}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{i.id}}</td>
                    <td>{{i.name}}</td>
                    <td>{{i.email}}</td>
                    <td><span class="badge male">{{i.gender}}</span></td>
                    <td>
                        {%for k in i.lang%}
                        <span>{{k}}</span>
                        {%endfor%}
                    </td>
                    <td>{{i.country}}</td>
                    <td>{{i.address}}</td>
                    <td>
                        <div class="action">
                            <a href="{%url 'update'%}?id={{i.id}}"><i class="fa fa-pen"></i></a>
                            <a href="{%url 'delete'%}?id={{i.id}}"><i class="fa fa-trash"></i></a>
                        </div>
                    </td>
                </tr>
                {%endfor%}
            </tbody>

        </table>

    </div>

</body>

</html>
